<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8f7ef"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="960" fill="url(#bg)"/>
  <circle cx="1418" cy="110" r="230" fill="#d1fae5" opacity="0.78"/>
  <circle cx="140" cy="840" r="220" fill="#e0ecff" opacity="0.72"/>

  <g transform="translate(96 92)">
    <rect x="0" y="0" width="290" height="52" rx="26" fill="#111827"/>
    <text x="28" y="35" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">WhatsApp Business</text>

    <text x="0" y="138" font-family="Inter, Arial, sans-serif" font-size="82" font-weight="900" fill="#111827">Sales Scripts</text>
    <text x="0" y="226" font-family="Inter, Arial, sans-serif" font-size="82" font-weight="900" fill="#0f9f63">and Quick Replies</text>
    <text x="2" y="294" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500" fill="#4b5563">Ready-to-use messages for pricing, booking,</text>
    <text x="2" y="338" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500" fill="#4b5563">follow-ups, promotions, and customer support.</text>

    <g transform="translate(0 430)">
      <rect width="250" height="74" rx="18" fill="#ffffff" filter="url(#shadow)"/>
      <circle cx="42" cy="37" r="18" fill="#10b981"/>
      <path d="M32 37 l8 9 l16 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="47" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#111827">Booking</text>
    </g>

    <g transform="translate(282 430)">
      <rect width="242" height="74" rx="18" fill="#ffffff" filter="url(#shadow)"/>
      <circle cx="42" cy="37" r="18" fill="#10b981"/>
      <path d="M32 37 l8 9 l16 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="47" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#111827">Pricing</text>
    </g>

    <g transform="translate(556 430)">
      <rect width="270" height="74" rx="18" fill="#ffffff" filter="url(#shadow)"/>
      <circle cx="42" cy="37" r="18" fill="#10b981"/>
      <path d="M32 37 l8 9 l16 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="47" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#111827">Follow-up</text>
    </g>
  </g>

  <g transform="translate(1018 140)" filter="url(#shadow)">
    <rect width="454" height="672" rx="44" fill="#ffffff"/>
    <rect x="0" y="0" width="454" height="94" rx="44" fill="#111827"/>
    <rect x="0" y="50" width="454" height="60" fill="#111827"/>
    <circle cx="56" cy="50" r="18" fill="#10b981"/>
    <text x="88" y="60" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Business Chat</text>

    <g transform="translate(42 146)">
      <rect width="296" height="90" rx="24" fill="#f3f4f6"/>
      <text x="24" y="38" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">Customer</text>
      <text x="24" y="68" font-family="Inter, Arial, sans-serif" font-size="21" fill="#374151">Hi, what is your price?</text>
    </g>

    <g transform="translate(84 268)">
      <rect width="328" height="132" rx="24" fill="#d1fae5"/>
      <text x="24" y="38" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#065f46">Quick reply</text>
      <text x="24" y="70" font-family="Inter, Arial, sans-serif" font-size="21" fill="#064e3b">Sure. The service starts at</text>
      <text x="24" y="100" font-family="Inter, Arial, sans-serif" font-size="21" fill="#064e3b">[PRICE]. I can check slots.</text>
    </g>

    <g transform="translate(42 440)">
      <rect width="370" height="148" rx="26" fill="#111827"/>
      <text x="28" y="44" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900" fill="#ffffff">Included</text>
      <text x="28" y="82" font-family="Inter, Arial, sans-serif" font-size="22" fill="#d1d5db">Welcome, pricing, booking,</text>
      <text x="28" y="114" font-family="Inter, Arial, sans-serif" font-size="22" fill="#d1d5db">promotion and follow-up scripts.</text>
    </g>
  </g>

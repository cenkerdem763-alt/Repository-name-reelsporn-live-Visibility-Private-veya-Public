      <text x="30" y="84" font-family="Inter, Arial, sans-serif" font-size="23" fill="#d1d5db">Turn simple price questions into a clear</text>
      <text x="30" y="118" font-family="Inter, Arial, sans-serif" font-size="23" fill="#d1d5db">appointment or next-step conversation.</text>
    </g>

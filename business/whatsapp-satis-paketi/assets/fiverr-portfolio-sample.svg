<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="soft" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef7f2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#soft)"/>
  <circle cx="1380" cy="160" r="210" fill="#dff7eb" opacity="0.8"/>
  <circle cx="230" cy="1030" r="260" fill="#e8f0ff" opacity="0.8"/>

  <g transform="translate(110 88)">

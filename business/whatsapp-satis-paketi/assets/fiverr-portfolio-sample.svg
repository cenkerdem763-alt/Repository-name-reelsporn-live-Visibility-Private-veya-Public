    <text x="0" y="54" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800" fill="#111827">WhatsApp Business</text>
    <text x="0" y="138" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800" fill="#0f9f63">Sales Message System</text>
    <text x="0" y="206" font-family="Inter, Arial, sans-serif" font-size="30" fill="#4b5563">Ready-to-use scripts for local businesses: pricing replies, booking, follow-ups, promotions, and support.</text>
  </g>

  <g transform="translate(110 370)" filter="url(#shadow)">
    <rect width="640" height="690" rx="34" fill="#ffffff"/>
    <rect x="44" y="44" width="552" height="74" rx="22" fill="#ecfdf5"/>
    <circle cx="88" cy="81" r="22" fill="#10b981"/>
    <text x="128" y="90" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#064e3b">Example business: Beauty Studio</text>

    <g transform="translate(44 162)">
      <rect width="418" height="96" rx="22" fill="#f3f4f6"/>

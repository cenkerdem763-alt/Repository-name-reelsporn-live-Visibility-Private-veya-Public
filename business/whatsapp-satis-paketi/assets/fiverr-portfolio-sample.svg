      <circle cx="39" cy="39" r="16" fill="#10b981"/>
      <path d="M31 39 l6 7 l13 -16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="49" font-family="Inter, Arial, sans-serif" font-size="25" fill="#111827">Follow-up messages for undecided leads</text>
    </g>


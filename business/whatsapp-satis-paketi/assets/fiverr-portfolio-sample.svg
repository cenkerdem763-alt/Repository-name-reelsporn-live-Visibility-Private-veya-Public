      <text x="28" y="40" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#065f46">Business reply</text>
      <text x="28" y="76" font-family="Inter, Arial, sans-serif" font-size="22" fill="#064e3b">Sure. Permanent nail polish is [PRICE].</text>
      <text x="28" y="110" font-family="Inter, Arial, sans-serif" font-size="22" fill="#064e3b">I can check today's available slots for you.</text>
    </g>

